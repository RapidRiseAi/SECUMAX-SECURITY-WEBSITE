<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="crestTitle">
  <title id="crestTitle">INTEGRI Forensic and Protection Services crest</title>
  <style>
    .w  { fill:none; stroke:#fff; stroke-width:6; stroke-linecap:round; stroke-linejoin:round; }
    .wf { fill:#fff; }
    .r  { fill:none; stroke:#E01B24; stroke-width:6; stroke-linecap:round; stroke-linejoin:round; }
  </style>

  <!-- ===== shield ===== -->
  <path d="M40 50 Q256 16 472 50 V264 C472 384 390 464 256 506 C122 464 40 384 40 264 Z"
        fill="none" stroke="#E01B24" stroke-width="13" stroke-linejoin="round"/>
  <path d="M74 82 Q256 52 438 82 V262 C438 362 370 430 256 468 C142 430 74 362 74 262 Z"
        fill="#000" stroke="#fff" stroke-width="8" stroke-linejoin="round"/>

  <!-- quadrant dividers (the roundel masks them at the centre) -->
  <g stroke="#fff" stroke-width="8" stroke-linecap="round">
    <path d="M82 248 H430"/>
    <path d="M256 72 V248"/>
    <path d="M256 252 L170 424"/>
    <path d="M256 252 L342 424"/>
  </g>

  <!-- ===== top-left : fingerprint ===== -->
  <g transform="translate(0,-6)">
    <path class="w" d="M131 186 C131 156 145 136 163 136 C181 136 195 156 195 186"/>
    <path class="w" d="M141 189 C141 165 151 149 163 149 C175 149 185 165 185 189"/>
    <path class="w" d="M151 192 C151 176 156 163 163 163 C170 163 175 176 175 192"/>
    <path class="w" d="M160 194 C160 186 161 179 163 179 C165 179 166 186 166 194"/>
    <g class="r" stroke-width="5">
      <path d="M124 146 V126 H144"/>
      <path d="M182 126 H202 V146"/>
      <path d="M124 190 V210 H144"/>
      <path d="M202 190 V210 H182"/>
    </g>
  </g>

  <!-- ===== top-right : polygraph trace ===== -->
  <path class="r" stroke-width="8" d="M292 168 H318 L328 140 L340 196 L352 122 L364 198 L374 156 L384 168 H412"/>

  <!-- ===== bottom-left : investigator ===== -->
  <g transform="translate(-8,2)">
    <path class="w" d="M130 306 C130 290 139 281 151 281 C163 281 172 290 172 306"/>
    <path class="w" d="M108 308 C126 300 176 300 194 308 C176 315 126 315 108 308 Z"/>
    <path class="w" d="M138 312 C138 328 144 336 151 336 C158 336 164 328 164 312"/>
    <path class="w" d="M118 392 C118 366 132 344 151 344 C160 344 167 347 173 353"/>
    <path class="w" d="M181 392 C181 381 179 372 176 364"/>
    <circle class="w" cx="190" cy="349" r="15"/>
    <path class="w" d="M179 361 L167 374"/>
  </g>

  <!-- ===== bottom-right : tactical helmet ===== -->
  <g transform="translate(4,2)">
    <path class="w" d="M330 354 C330 324 345 306 365 306 C385 306 400 324 400 354"/>
    <path class="w" d="M339 331 C349 321 381 321 391 331"/>
    <path class="w" d="M330 354 C330 368 337 378 348 382"/>
    <path class="w" d="M400 354 C400 366 394 375 385 380"/>
    <path class="w" d="M348 382 L357 393"/>
    <path class="w" stroke-width="4.5" d="M337 345 H351"/>
    <path class="w" stroke-width="4.5" d="M379 345 H393"/>
  </g>

  <!-- ===== bottom-centre : protection officer ===== -->
  <g>
    <circle class="wf" cx="256" cy="341" r="18"/>
    <path fill="#000" d="M240 336 h32 v3.5 a6.2 6.2 0 0 1 -12.4 0 v-1.2 h-7.2 v1.2 a6.2 6.2 0 0 1 -12.4 0 z"/>
    <path class="w" d="M225 402 C225 384 239 371 256 371 C273 371 287 384 287 402"/>
    <path class="w" d="M245 373 L256 388 L267 373"/>
    <path fill="#E01B24" d="M256 388 L261 395 L256 407 L251 395 Z"/>
    <path class="w" stroke-width="4.5" d="M272 339 C280 341 282 349 277 354"/>
  </g>

  <!-- ===== padlock ===== -->
  <g>
    <path class="w" d="M243 414 V406 C243 398 249 392 256 392 C263 392 269 398 269 406 V414"/>
    <rect class="wf" x="235" y="414" width="42" height="31" rx="5"/>
    <circle cx="256" cy="426" r="5" fill="#000"/>
    <path d="M254 429 h4 v9 h-4 z" fill="#000"/>
  </g>

  <!-- ===== central eagle roundel ===== -->
  <circle cx="256" cy="250" r="78" fill="#000"/>
  <circle cx="256" cy="250" r="78" fill="none" stroke="#E01B24" stroke-width="13"/>
  <g transform="translate(256,250) scale(.94) translate(-256,-250)">
    <!-- swept crest feathers -->
    <path fill="#fff" d="M243 200 L222 208 L208 192 Z"/>
    <path fill="#fff" d="M219 207 L198 234 L192 214 Z"/>
    <!-- skull, overhanging brow and long hooked beak, one angular silhouette -->
    <path fill="#fff" d="M198 234 L219 207 L254 200 L280 212 L320 226 L314 247
                         L299 238 L276 236 L266 267 L241 286 L212 274 L198 252 Z"/>
    <!-- neck feathers -->
    <path fill="#fff" d="M212 274 L198 288 L228 283 Z"/>
    <!-- mouth line separating the mandibles -->
    <path fill="none" stroke="#000" stroke-width="4.5" stroke-linecap="round" d="M278 228 L309 236"/>
    <!-- angular raptor eye -->
    <path fill="#E01B24" d="M260 214 L277 220 L273 229 L257 222 Z"/>
  </g>
</svg>
