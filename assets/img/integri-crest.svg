  <!-- ===== central eagle roundel ===== -->
  <circle cx="256" cy="250" r="78" fill="#000"/>
  <circle cx="256" cy="250" r="78" fill="none" stroke="#E01B24" stroke-width="13"/>
  <g>
    <!-- crest feathers -->
    <path fill="#fff" d="M243 219 C236 205 238 192 249 184 C246 197 249 206 256 212 Z"/>
    <path fill="#fff" d="M231 226 C220 214 218 199 227 190 C227 203 232 212 240 217 Z"/>
    <path fill="#fff" d="M259 217 C258 203 265 192 277 188 C271 198 271 208 273 214 Z"/>
    <!-- head -->
    <path fill="#fff" d="M249 214 C269 214 285 229 287 248 C289 269 275 288 252 290 C229 292 212 276 211 255 C210 232 228 214 249 214 Z"/>
    <!-- beak -->
    <path fill="#fff" d="M279 236 L314 246 C318 247 318 252 314 253 L294 258 L286 270 C281 262 278 250 279 236 Z"/>
    <!-- neck feathers -->
    <path fill="#fff" d="M223 280 C212 290 201 293 192 291 C203 285 210 276 214 267 Z"/>
    <!-- eye -->
    <circle cx="266" cy="242" r="8" fill="#E01B24"/>
  </g>
</svg>
