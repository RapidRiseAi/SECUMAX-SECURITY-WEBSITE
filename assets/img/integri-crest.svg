  <!-- ===== bottom-left : investigator ===== -->
  <g transform="translate(-4,4)">
    <path class="w" d="M128 312 C128 294 136 284 150 284 C164 284 172 294 172 312"/>
    <path class="w" d="M108 314 C130 306 170 306 192 314"/>
    <path class="w" d="M134 318 C134 332 141 340 150 340 C159 340 166 332 166 318"/>
    <path class="w" d="M116 392 C116 366 130 348 150 348 C158 348 165 351 171 355"/>
    <path class="w" d="M182 392 C182 378 179 366 174 358"/>
    <circle class="w" cx="196" cy="352" r="16"/>
    <path class="w" d="M185 364 L172 378"/>
  </g>

  <!-- ===== bottom-right : tactical helmet ===== -->
  <g transform="translate(6,4)">
    <path class="w" d="M326 350 C326 320 341 302 362 302 C383 302 398 320 398 350"/>
    <path class="w" d="M326 350 C328 364 335 373 346 377 L352 388"/>
    <path class="w" d="M398 350 C396 362 390 370 381 375"/>
    <path class="w" d="M344 316 C352 310 372 308 384 314"/>
    <path class="w" stroke-width="5" d="M334 340 H352"/>
    <path class="w" stroke-width="5" d="M334 354 H350"/>
    <path class="w" stroke-width="5" d="M378 318 L390 330"/>
  </g>

  <!-- ===== bottom-centre : protection officer ===== -->
  <g>
    <circle class="w" cx="256" cy="344" r="19"/>
    <path class="rf" d="M237 342 h38 v7 a19 19 0 0 1 -38 0 z" opacity="0"/>
    <path fill="#fff" d="M238 338 h36 v8 h-36 z"/>
    <path fill="#000" d="M240 340 h14 v5 h-14 z M258 340 h14 v5 h-14 z"/>
    <path class="w" d="M222 404 C222 384 236 370 256 370 C276 370 290 384 290 404"/>
    <path class="w" d="M244 372 L256 388 L268 372"/>
    <path class="rf" d="M256 388 L262 396 L256 412 L250 396 Z"/>
    <path class="w" stroke-width="5" d="M274 342 C282 344 284 352 280 358"/>
  </g>

  <!-- ===== padlock ===== -->
  <g transform="translate(0,4)">
    <path class="w" d="M242 424 V415 C242 407 248 401 256 401 C264 401 270 407 270 415 V424"/>
    <rect class="wf" x="234" y="424" width="44" height="32" rx="5"/>
    <circle cx="256" cy="436" r="5" fill="#000"/>
    <path d="M254 439 h4 v9 h-4 z" fill="#000"/>
