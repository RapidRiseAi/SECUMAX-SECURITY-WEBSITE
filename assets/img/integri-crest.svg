<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="crestTitle">
  <title id="crestTitle">INTEGRI Forensic and Protection Services crest</title>
  <style>
    .w  { fill:none; stroke:#fff; stroke-width:6; stroke-linecap:round; stroke-linejoin:round; }
    .wf { fill:#fff; }
    .r  { fill:none; stroke:#E01B24; stroke-width:6; stroke-linecap:round; stroke-linejoin:round; }
    .rf { fill:#E01B24; }
  </style>

  <!-- ===== shield ===== -->
  <path d="M40 50 Q256 16 472 50 V264 C472 384 390 464 256 506 C122 464 40 384 40 264 Z"
        fill="none" stroke="#E01B24" stroke-width="13" stroke-linejoin="round"/>
  <path d="M74 82 Q256 52 438 82 V262 C438 362 370 430 256 468 C142 430 74 362 74 262 Z"
        fill="#000" stroke="#fff" stroke-width="8" stroke-linejoin="round"/>

  <!-- quadrant dividers (masked at centre by the roundel) -->
  <g stroke="#fff" stroke-width="8" stroke-linecap="round">
    <path d="M80 248 H432"/>
    <path d="M256 62 V248"/>
    <path d="M256 252 L168 428"/>
    <path d="M256 252 L344 428"/>
  </g>

  <!-- ===== top-left : fingerprint ===== -->
  <g transform="translate(0,-6)">
    <path class="w" d="M131 186 C131 156 145 136 163 136 C181 136 195 156 195 186"/>
    <path class="w" d="M141 189 C141 165 151 149 163 149 C175 149 185 165 185 189"/>
    <path class="w" d="M151 192 C151 176 156 163 163 163 C170 163 175 176 175 192"/>
    <path class="w" d="M160 194 C160 186 161 179 163 179 C165 179 166 186 166 194"/>
    <g class="r" stroke-width="5">
