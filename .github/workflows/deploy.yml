# Deploys the site to the live Worker on every push to main.
#
# This replaces Cloudflare's own Git integration (Workers Builds), which stopped
# hearing about pushes in October 2026: commits reached GitHub and never started
# a build, not even a failed one, and disconnecting and reconnecting the repo did
# not bring it back. Deploying from here depends on nothing but an API token, so
# keep "Disable builds" switched on in the Worker's Settings -> Builds, or both
# would deploy every push.
#
# Needs one repository secret, CLOUDFLARE_API_TOKEN, created from the "Edit
# Cloudflare Workers" token template. To redeploy without a push: Actions ->
# Deploy -> Run workflow.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two deploys at once, and never cancel one halfway through.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The same gate a contributor runs before pushing. A red validator means
      # the live site keeps the last good version rather than a broken one.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: python3 tools/validate.py

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npx --yes wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Not a secret: it is in every dashboard URL. Set so a token that can
          # see more than one account still deploys to the right one.
          CLOUDFLARE_ACCOUNT_ID: a6cfc46ce8906b9e7caddc2a520ccddd
